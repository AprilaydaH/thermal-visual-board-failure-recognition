# Tooling when working inside pc/. The installable project is the repository root:
#   pip install -e ".[dev]"

[tool.ruff]
extend = "../pyproject.toml"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = ["slow: trains a model, takes tens of seconds"]
